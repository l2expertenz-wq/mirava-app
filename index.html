      --bg: var(--tg-theme-bg-color, #0f172a);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --link: var(--tg-theme-link-color, #38bdf8);
      --btn-bg: var(--tg-theme-button-color, #3b82f6);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      --success: #22c55e;
      --warning: #f59e0b;
      --purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding: 10px 0 4px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--accent-gradient);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
      margin-bottom: 8px;
      font-size: 26px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--hint);
      margin-top: 3px;
    }

    /* STATUS CARD */
    .status-card {
      background: var(--secondary-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-active {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-pulse {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }
    .servers-count-tag {
      font-size: 12px;
      color: var(--hint);
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* ALL SERVERS BUTTON */
    .btn-all-servers {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-all-servers:active {

    }

      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--hint);
    }

      background: var(--secondary-bg);
      border-radius: 16px;
      padding: 4px;
      gap: 4px;
      border: 1px solid var(--card-border);
    }
    .country-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--hint);
      padding: 10px 6px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .country-tab.active {
      background: var(--btn-bg);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

      flex-direction: column;
      gap: 12px;
    }
    .protocol-card {
      background: var(--secondary-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--card-shadow);

      flex-direction: column;
      gap: 12px;
      transition: transform 0.15s;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .proto-left {

      align-items: center;

      justify-content: center;

      font-weight: 700;

    .proto-desc {

      color: var(--hint);
      margin-top: 2px;

    .proto-ping {

      color: var(--success);
      font-weight: 600;
      background: rgba(34, 197, 94, 0.1);
      padding: 3px 8px;
      border-radius: 10px;

      display: grid;

      gap: 8px;

      color: white;
      border: none;
      padding: 10px 8px;
      border-radius: 12px;

      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: opacity 0.2s;

    .btn-proto-copy {
      grid-column: span 2;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);

      padding: 9px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;

      font-size: 13px;

    .btn-download:active {

      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

      windows: [
        { name: 'Hiddify Next', desc: 'Рекомендуется ⭐ (GitHub)', iconClass: 'happ', icon: '💻', url: 'https://github.com/hiddify/hiddify-next/releases' },
        { name: 'v2rayN', desc: 'Классика для Windows', iconClass: 'incy', icon: '🖥️', url: 'https://github.com/2dust/v2rayN/releases' }
      ],
      mac: [
        { name: 'Happ Proxy', desc: 'Mac App Store (VLESS + Hy2)', iconClass: 'happ', icon: '⚡', url: 'https://apps.apple.com/app/happ-proxy-utility/id6504287215' },
        { name: 'FoXray', desc: 'Клиент из App Store', iconClass: 'incy', icon: '🦊', url: 'https://apps.apple.com/app/foxray/id6448898396' }
      ]
    };

    // Helper Toast
    function showToast(text, icon = '✅') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').innerText = text;
      document.getElementById('toast-icon').innerText = icon;
      toast.classList.add('show');
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Copy to clipboard
    function copyText(str, msg = 'Ключ скопирован!') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(str).then(() => showToast(msg)).catch(() => fallbackCopy(str, msg));
      } else {
        fallbackCopy(str, msg);
      }
    }

    function fallbackCopy(str, msg) {
      const el = document.createElement('textarea');
      el.value = str;
      el.style.position = 'fixed';
      el.style.opacity = '0';
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast(msg);
    }

    // Connect via Deep Link
    function openHapp(link) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      window.location.href = `happ://add/${link}`;
      showToast('Добавляем в Happ Proxy...', '⚡');
    }

    function openIncy(link) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      window.location.href = `incy://${link}`;
      showToast('Добавляем в INCY...', '🛡️');
    }

    // Render Country Protocols
    function renderProtocols(countryCode) {
      const container = document.getElementById('protocols-list');
      const loc = SERVERS[countryCode];
      if (!loc) return;

      container.innerHTML = loc.protocols.map(p => `
        <div class="protocol-card">
          <div class="protocol-header">
            <div class="proto-left">
              <div class="proto-badge ${p.badgeClass}">${p.icon}</div>
              <div class="proto-title-box">
                <div class="proto-name">${p.name}</div>
                <div class="proto-desc">${p.desc}</div>
              </div>
            </div>
            <div class="proto-ping">🟢 ${p.ping}</div>
          </div>
          <div class="proto-actions">
            <button class="btn-connect-happ" onclick="openHapp('${encodeURIComponent(p.link)}')">
              ⚡ В Happ (1 клик)
            </button>
            <button class="btn-connect-incy" onclick="openIncy('${encodeURIComponent(p.link)}')">
              🛡️ В INCY (1 клик)
            </button>
            <button class="btn-proto-copy" onclick="copyText('${p.link}', 'Ключ ${p.name} скопирован!')">
              📋 Скопировать ключ подключения
            </button>
          </div>
        </div>
      `).join('');
    }

    // Render Device Apps
    function renderDeviceApps(dev) {
      const container = document.getElementById('device-apps-container');
      const apps = APPS[dev] || APPS.ios;
      container.innerHTML = apps.map(a => `
        <div class="app-card">
          <div class="app-info">
            <div class="app-icon ${a.iconClass}">${a.icon}</div>
            <div>
              <div class="app-name">${a.name}</div>
              <div class="app-desc">${a.desc}</div>
            </div>
          </div>
          <a class="btn-download" href="${a.url}" target="_blank">📲 Скачать</a>
        </div>
      `).join('');
    }

    // Collect all 9 links
    function getAllLinksString() {
      const all = [];
      for (const c in SERVERS) {
        for (const p of SERVERS[c].protocols) {
          all.push(p.link);
        }
      }
      return all.join('\n');
    }

    // Event Listeners for Country Tabs
    document.querySelectorAll('.country-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.country-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCountry = tab.getAttribute('data-country');
        if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        renderProtocols(currentCountry);
      });
    });

    // Event Listeners for Device Tabs
    document.querySelectorAll('.dev-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.dev-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentDevice = tab.getAttribute('data-dev');
        if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        renderDeviceApps(currentDevice);
      });
    });

    // Add All Servers Button
    document.getElementById('btn-add-all').addEventListener('click', () => {
      const all = getAllLinksString();
      copyText(all, 'Все 9 серверов скопированы! Вставьте в Happ или v2rayNG');
      setTimeout(() => {
        // also attempt deep link
        window.location.href = `happ://add/${encodeURIComponent(SERVERS[currentCountry].protocols[0].link)}`;
      }, 600);
    });

    // Initial render
    renderProtocols(currentCountry);
    renderDeviceApps(currentDevice);

  </script>
</body>
</html>
