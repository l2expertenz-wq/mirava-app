<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1120">
  <title>Happ Proxy — Подключение Mirava VPN</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.7);
      --text-main: #ffffff;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b1120 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .badge-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
    }

    .logo-badge {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(135deg, #059669 0%, #0284c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: pulse 2.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4); }
      100% { transform: scale(1.04); box-shadow: 0 15px 35px rgba(5, 150, 105, 0.6); }
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .status-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(59, 130, 246, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .status-text b {
      color: #38bdf8;
    }

    .btn-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #059669 0%, #0284c7 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 16px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.98);
      filter: brightness(1.1);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 4px 0;
    }

    .install-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: -4px;
    }

    .download-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .dl-btn:active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge-wrap">
      <div class="logo-badge">⚡</div>
    </div>

    <div>
      <h1>Happ Proxy</h1>
      <p class="subtitle">Импорт подписки Mirava VPN</p>
    </div>

    <div class="card">
      <div class="status-box">
        <div class="spinner"></div>
        <div class="status-text">
          Открываем приложение <b>Happ Proxy</b>…<br>
          Подтвердите добавление подписки в окне приложения.
        </div>
      </div>

      <a id="direct-open-btn" href="#" class="btn-main">
        <span>⚡</span> Открыть в Happ
      </a>

      <button id="copy-btn" class="btn-secondary">
        <span>📋</span> Скопировать ключ подписки
      </button>

      <div class="divider"></div>

      <div class="install-title">Ещё не установили Happ?</div>

      <div class="download-grid">
        <a href="https://apps.apple.com/app/happ-proxy-utility/id6504287215" target="_blank" class="dl-btn">
          <span>🍏</span> iOS (iPhone)
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.happproxy" target="_blank" class="dl-btn">
          <span>🤖</span> Android
        </a>
        <a href="https://github.com/Happ-proxy/happ-desktop/releases/latest/download/setup-Happ.x64.exe" target="_blank" class="dl-btn">
          <span>💻</span> Windows
        </a>
        <a href="https://github.com/Happ-proxy/happ-desktop/releases/latest/download/Happ.macOS.universal.dmg" target="_blank" class="dl-btn">
          <span>🍏</span> macOS
        </a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">✓ Ключ скопирован в буфер!</div>

  <script>
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // Поддерживаем разные варианты параметра: ?u=, ?url=, ?key=, ?sub=
    const subUrl = getQueryParam('u') || getQueryParam('url') || getQueryParam('key') || getQueryParam('sub') || '';

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    if (subUrl) {
      const cleanUrl = decodeURIComponent(subUrl).trim();
      const happSchemeUrl = 'happ://add/' + cleanUrl;

      // Настройка кнопки прямого открытия
      const directBtn = document.getElementById('direct-open-btn');
      directBtn.href = happSchemeUrl;

      // Автоматическое открытие через location.replace
      try {
        window.location.replace(happSchemeUrl);
      } catch (e) {
        window.location.href = happSchemeUrl;
      }

      // Дублирующий фоллбек через скрытую ссылку через 350мс
      setTimeout(() => {
        try {
          const a = document.createElement('a');
          a.href = happSchemeUrl;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (e) {}
      }, 350);

      // Кнопка копирования
      document.getElementById('copy-btn').addEventListener('click', () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cleanUrl).then(() => {
            showToast('✓ Ключ подписки скопирован!');
          }).catch(() => {
            fallbackCopy(cleanUrl);
          });
        } else {
          fallbackCopy(cleanUrl);
        }
      });
    } else {
      document.querySelector('.status-text').innerHTML = '⚠️ Ссылка подписки не найдена.<br>Пожалуйста, откройте ссылку из бота заново.';
      document.getElementById('direct-open-btn').style.display = 'none';
      document.getElementById('copy-btn').style.display = 'none';
    }

    function fallbackCopy(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast('✓ Ключ подписки скопирован!');
      } catch (e) {
        showToast('❌ Не удалось скопировать');
      }
      document.body.removeChild(textArea);
    }
  </script>
</body>
</html>
